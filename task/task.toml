artifacts = ["/app/output/inventory_normalized.jsonl", "/app/output/rejected_rows.log"]  # paths the verifier reads from the agent

[task]
name = "dynamo/inventory-format-normalizer"  # required format: org/name
description = "Normalize a corrupted multi-source inventory export file into clean JSONL"

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Data Processing and ETL"
subcategory = "File format parsing and serialization"
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
# --- You fill these in ---
task_objective = ["implement", "transform", "validate"]
artifact_type = ["single_script_or_program", "dataset_or_tabular_file"]
expert_time_estimate_hours = 3.5
difficulty_explanation = """
The core difficulty is not any single transformation but their interaction, plus one
genuine judgment call that cannot be resolved by a fixed rule alone. Encoding
detection must happen per-row (not per-file) since rows from different source systems
are mixed within one file; date normalization requires disambiguating three formats
without explicit markers; and truncated/malformed rows must be detected structurally
(field count, JSON validity) before parsing, not via exception-driven control flow,
since a naive implementation will either crash on the first bad row or silently
corrupt data by mis-parsing it. Beyond that, conflicting duplicates (same store_id/
sku/export_ts key, but disagreeing quantity or extra_attrs) require a resolution
policy derived from an intermediate computed value -- the parsed completeness of each
candidate record -- rather than a positional rule like "keep the first" or "keep the
last"; a solution that hardcodes either positional rule will fail on at least one of
the two fixtures, since each is constructed so the opposite row wins. Getting all of
this correct simultaneously, on data that fails in multiple independent ways per row,
is what separates a robust ETL implementation from a brittle one. A further trap: two
rows' extra_attrs values contain a literal | character or an apostrophe inside a
string value, which defeats both a naive full-line str.split("|") (miscounts fields)
and a naive blanket "'" -> '"' quote-swap (corrupts the value) -- correct field
splitting must cap at 4 delimiters (extra_attrs is always last) and correct quote
handling must parse via a real single-quoted-literal parser, not character
substitution. Another two rows nest an array or object inside extra_attrs (e.g. a
"tags" list, or a nested object), so a one-line rfind('}') or rfind(' [') to locate
the decorative suffix boundary is not reliable in general -- the true end of the
extra_attrs object must be found by tracking brace/bracket depth while skipping over
quoted-string contents.

The input fixture is synthetically generated to exhibit these corruption and conflict
patterns in combination; it is not sourced from a real retailer's export. The task
mirrors work a data or ETL engineer regularly does when consolidating point-of-sale
exports from multiple vendors into a single warehouse-ready feed, where each vendor's
export tool introduces its own encoding, date, and retry/conflict quirks.
"""
solution_explanation = """
Process the file line-by-line as raw bytes rather than assuming a single encoding.
For each line: attempt UTF-8 decode, fall back to cp1252/Latin-1 on failure. Split
each decoded line on at most 4 pipe characters (extra_attrs is always the final
column, so any | inside its value must stay part of the value); validate the
resulting field count before attempting to parse the embedded JSON blob, and route
rows that fail this check to rejected_rows.log rather than raising. Parse extra_attrs
by trying strict JSON first, then falling back to a real Python-literal parser (not a
blind quote-character substitution) so values containing apostrophes or mixed
single/double quoting still parse correctly. Locate the extra_attrs object's true end
by walking forward from the first '{' and tracking brace/bracket depth (skipping over
quoted-string contents) until it returns to zero, rather than searching backward for
the last '}' or '[' -- this stays correct even when the object contains a nested
array or object. Use a small format-fingerprint function
to disambiguate MM/DD/YYYY, DD-MM-YYYY, and epoch-seconds date fields. Group by the
composite key (store_id, sku, export_ts); when two parsed records share a key but
disagree in content, keep the one with the higher (extra_attrs key count,
has-non-null-quantity) completeness score rather than a positional first/last rule,
breaking any remaining tie by file order. Treat the quantity field's null sentinels
("", "NULL", "N/A", "-1") as exact matches on the raw field, not after trimming
whitespace, so a padded variant like " NULL " correctly falls through to integer
parsing (and fails it) instead of being silently treated as null.
"""
verification_explanation = """
The reference solution's output is compared field-by-field against the agent's
inventory_normalized.jsonl after canonical key-sorting. Row counts for both valid and
rejected records are checked exactly against known ground-truth counts baked into the
input fixture. A second hidden input file with the same corruption patterns but
different data is also run to catch overfit/hardcoded solutions; the public and
hidden fixtures each contain one conflicting-duplicate pair where the opposite row
(first vs. second in file order) is the more complete one, so a solution that
hardcodes a positional tie-break instead of computing completeness will fail on at
least one fixture. Both fixtures also each contain two rows whose extra_attrs value
contains a literal | or apostrophe character, catching solutions that split on every
| unconditionally or that quote-swap by blind character substitution instead of a
real literal parser. Both fixtures also each contain two rows where extra_attrs
nests an array or object inside itself before the decorative suffix, catching
solutions that find the JSON boundary with a naive last-brace/last-bracket search
instead of depth-matching. Each fixture also contains one row with a whitespace-
padded quantity sentinel (e.g. " NULL "), which is not an exact match to the
documented literal sentinels and must therefore be rejected rather than silently
coerced to null.
"""

